name: barbershop

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-barbershop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barbershop}
      POSTGRES_DB: ${DB_NAME:-barbershop}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      SMTP_HOST: mailpit
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '1025:1025'
      - '8025:8025'

  # US-13: conector de WhatsApp (API não oficial). Guarda as sessões num schema
  # próprio do Postgres do compose; o webhook chama a API rodando no host.
  evolution-api:
    profiles: [whatsapp]
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-only-evolution-key}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER:-barbershop}:${DB_PASSWORD:-barbershop}@postgres:5432/${DB_NAME:-barbershop}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: 'false'
      CACHE_LOCAL_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - evolution-instances:/evolution/instances
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres-data:
  evolution-instances:
